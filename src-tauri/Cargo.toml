[package]
name = "thinkutils"
version = "0.2.0"
description = "ThinkPad utilities for Linux - Fan control, battery management, and system monitoring"
authors = ["Viet Anh Nguyen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thinkutils_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
url = "2.5"
rand = "0.8"
lazy_static = "1.4"
# rmcp 3.9+. Streamable HTTP is the only server transport; its config still
# carries allowed_hosts/allowed_origins, which close the DNS-rebinding and
# cross-origin CSRF vector against loopback. 3.9 also clears the 2026 OAuth SSRF
# and unbounded-response advisories that affected 2.x.
rmcp = { version = "3.9", features = ["server", "server-side-http", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "0.8"
tokio-util = "0.7"
axum = "0.8.9"

# Windows-only native APIs. Used instead of shelling out to PowerShell every
# couple of seconds for monitoring and battery reads; PowerShell is reserved for
# one-shot WMI/CIM queries and Defender actions.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
] }
