<div class="titlebar" data-tauri-drag-region>
  <div class="titlebar-left">
    <div class="logo-dot-small"></div>
    <span class="titlebar-title">ThinkUtils</span>
  </div>
  <div class="titlebar-center" id="titlebar-stats">
    <div class="titlebar-stat" id="titlebar-temp-stat" title="CPU Temperature">
      <span class="stat-icon">🌡️</span>
      <span class="stat-val" id="titlebar-temp">--°C</span>
    </div>
    <div class="titlebar-stat" id="titlebar-fan-stat" title="Fan Speed">
      <span class="stat-icon">🌀</span>
      <span class="stat-val" id="titlebar-fan">-- RPM</span>
    </div>
    <div class="titlebar-stat" id="titlebar-battery-stat" title="Battery Level">
      <span class="stat-icon">🔋</span>
      <span class="stat-val" id="titlebar-battery">--%</span>
    </div>
  </div>
  <div class="titlebar-buttons">
    <button class="titlebar-button" id="minimize-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <line x1="0" y1="6" x2="12" y2="6" stroke="currentColor" stroke-width="1" />
      </svg>
    </button>
    <button class="titlebar-button" id="maximize-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <rect
          x="1"
          y="1"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
        />
      </svg>
    </button>
    <button class="titlebar-button close-btn" id="close-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1" />
        <line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1" />
      </svg>
    </button>
  </div>
</div>
